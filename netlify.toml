# Netlify build settings for FlexiFurni (Vite + React SPA)
[build]
  command = "npm run build"
  publish = "dist"

# SPA fallback (harmless with HashRouter, required if router ever changes)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Node version needed by Vite 8 / React 19
[build.environment]
  NODE_VERSION = "22"

# Cache images + fonts aggressively, never cache HTML
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache"
